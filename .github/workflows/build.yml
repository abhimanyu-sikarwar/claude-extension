name: Build Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build for ${{ matrix.browser }}
      run: npm run build:${{ matrix.browser }}

    - name: Package ${{ matrix.browser }} extension
      run: npm run package:${{ matrix.browser }}

    - name: Upload ${{ matrix.browser }} artifact
      uses: actions/upload-artifact@v4
      with:
        name: claude-to-markdown-${{ matrix.browser }}
        path: dist/claude-to-markdown-${{ matrix.browser }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Download Chrome artifact
      uses: actions/download-artifact@v4
      with:
        name: claude-to-markdown-chrome
        path: ./dist

    - name: Download Firefox artifact
      uses: actions/download-artifact@v4
      with:
        name: claude-to-markdown-firefox
        path: ./dist

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/claude-to-markdown-chrome.zip
          dist/claude-to-markdown-firefox.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}